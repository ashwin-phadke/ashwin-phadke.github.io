<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Ashwin Phadke | Portfolio</title>
  <meta name="description"
    content="Portfolio of Ashwin Phadke, specializing in building scalable AI products and research." />

  <!-- Open Graph / Meta Tags -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Ashwin Phadke | Portfolio" />
  <meta property="og:description"
    content="Portfolio of Ashwin Phadke, specializing in building scalable AI products and research." />
  <meta property="og:image" content="https://ashwinphadke.com/profile.jpeg" />
  <meta name="twitter:card" content="summary" />

  <!-- Apply the dark theme before first paint: the visitor's saved choice, else their OS setting -->
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) { }
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) document.documentElement.classList.add('dark');
    })();
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
